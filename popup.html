<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      margin: 0;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: 0.3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #5cb85c;
    }

    input:checked+.slider:before {
      transform: translateX(24px);
    }

    .status {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
    }

    .status-active {
      color: #5cb85c;
    }

    .status-inactive {
      color: #f0ad4e;
    }

    .status-disabled {
      color: #d9534f;
    }

    .info {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <h1>📰 Apollo News Tab</h1>

  <div class="toggle-container">
    <span class="toggle-label">Auto-Click</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status">
    <div class="status-label">Status</div>
    <div class="status-value" id="status">Checking...</div>
  </div>

  <div class="info">
    When enabled, automatically clicks the "News" tab on Apollo organization pages.
  </div>

  <script src="popup.js"></script>
</body>

</html>
