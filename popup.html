<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #fff;
      padding: 2px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(0,0,0,0.3);
      border-radius: 24px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background: rgba(255,255,255,0.3);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Content */
    .content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Row */
    .row {
      background: #252542;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .row-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
    }

    /* Target Input */
    #target-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #fff;
      background: #1a1a2e;
      border: 1px solid #3f3f5a;
      border-radius: 6px;
      outline: none;
    }

    #target-input:focus {
      border-color: #6366f1;
    }

    /* Delay Row */
    .delay-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .delay-input {
      width: 70px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
      color: #fff;
      background: #1a1a2e;
      border: 1px solid #3f3f5a;
      border-radius: 6px;
      outline: none;
      text-align: center;
    }

    .delay-input:focus {
      border-color: #6366f1;
    }

    .delay-sep {
      color: #555;
      font-size: 14px;
    }

    .delay-unit {
      color: #888;
      font-size: 11px;
      margin-left: auto;
    }

    /* Status */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #252542;
      border-radius: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.off {
      background: #6b7280;
    }

    .status-text {
      font-size: 12px;
      color: #aaa;
    }

    .status-text span {
      color: #22c55e;
      font-weight: 500;
    }

    .status-text.off span {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-left">
      <img src="icons/logo.png" alt="" class="logo-img" />
      <span class="logo-text">WannaClick Pro</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="content">
    <div class="row">
      <div class="row-label">Target Element</div>
      <input type="text" id="target-input" placeholder="News" />
    </div>

    <div class="row">
      <div class="row-label">Delay (seconds)</div>
      <div class="delay-row">
        <input type="number" class="delay-input" id="delay-min" min="0" step="0.5" placeholder="0" />
        <span class="delay-sep">-</span>
        <input type="number" class="delay-input" id="delay-max" min="0" step="0.5" placeholder="3" />
        <span class="delay-unit">sec</span>
      </div>
    </div>

    <div class="status-row" id="status-row">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text" id="status-text">Status: <span id="status">Ready</span></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
